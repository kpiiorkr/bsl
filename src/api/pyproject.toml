[project]
name = "bsl-api"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.10,<3",
]

[dependency-groups]
dev = [
  "openapi-spec-validator>=0.7,<1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "respx>=0.22,<1",
  "schemathesis>=4.1,<5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
