services:
  backend:
    build:
      context: ./src/api
    environment:
      ALLOWED_ORIGINS: '["http://localhost:8080"]'
      HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS:-10}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      NEIS_API_KEY: ${NEIS_API_KEY:-replace-with-neis-api-key}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./src/web
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped
